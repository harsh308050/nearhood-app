name: nearhood
description: "Nearhood is a Premium Hyperlocal Social Network built exclusively for India. It connects people who live in the same locality, same streets, same area, real neighbors - on a single trusted, real-name platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  http: ^1.6.0
  cached_network_image: ^3.4.1
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.3.0
  google_sign_in: ^7.2.0
  flutter_dotenv: ^5.2.1
  flutter_bloc: ^9.0.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  location: ^8.0.1
  image_picker: ^1.2.2
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  intl: ^0.20.2
  share_plus: ^13.1.0
  app_links: ^7.0.0
  socket_io_client: ^3.0.2
  equatable: ^2.0.8
  flutter_local_notifications: ^22.0.1
  record: ^6.2.1
  just_audio: ^0.9.43
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/clash_display/ClashDisplay-Regular.otf
        - asset: assets/fonts/clash_display/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/clash_display/ClashDisplay-Bold.otf
          weight: 700
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 600
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
