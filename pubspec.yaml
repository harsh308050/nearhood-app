name: nearhood
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  http: ^1.6.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/clash_display/ClashDisplay-Regular.otf
        - asset: assets/fonts/clash_display/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/clash_display/ClashDisplay-Bold.otf
          weight: 700
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 600
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
