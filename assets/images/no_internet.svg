<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. Decorative Sparks / Background Elements -->
  <!-- Left Cloud Sparks -->
  <path d="M 55 175 L 40 165" stroke="#1E2229" stroke-width="6" stroke-linecap="round"/>
  <path d="M 45 190 L 30 190" stroke="#1E2229" stroke-width="6" stroke-linecap="round"/>
  <path d="M 50 205 L 35 215" stroke="#1E2229" stroke-width="6" stroke-linecap="round"/>

  <!-- Left Side Ornaments -->
  <!-- Small Circle -->
  <circle cx="120" cy="290" r="5" stroke="#1E2229" stroke-width="5" fill="none"/>
  <!-- Plus Symbol -->
  <path d="M 137 335 L 153 335" stroke="#1E2229" stroke-width="5" stroke-linecap="round"/>
  <path d="M 145 327 L 145 343" stroke="#1E2229" stroke-width="5" stroke-linecap="round"/>
  <!-- Zigzag Left -->
  <path d="M 90 310 L 105 320 L 95 330 L 110 340" stroke="#1E2229" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Side Ornaments -->
  <!-- X Mark -->
  <path d="M 288 288 L 302 302" stroke="#1E2229" stroke-width="5" stroke-linecap="round"/>
  <path d="M 302 288 L 288 302" stroke="#1E2229" stroke-width="5" stroke-linecap="round"/>
  <!-- Small Circle Right -->
  <circle cx="270" cy="330" r="5" stroke="#1E2229" stroke-width="5" fill="none"/>
  <!-- Zigzag Right -->
  <path d="M 300 310 L 315 320 L 305 330 L 320 340" stroke="#1E2229" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Lightning Bolt (Behind the Cloud) -->
  <path d="M 210 240 L 260 240 L 225 305 L 260 305 L 180 380 L 205 305 L 175 305 Z" fill="#FFD13B" stroke="#1E2229" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Cloud (In Front of the Lightning Bolt) -->
  <path d="M 80 250 C 50 250 50 190 80 190 C 80 150 120 130 150 150 C 170 90 270 90 290 150 C 320 130 360 160 350 210 C 360 240 340 250 320 250 Z" fill="#EFF2F7" stroke="#1E2229" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. Sad Cloud Face -->
  <!-- Left Eye -->
  <circle cx="160" cy="180" r="6" fill="#1E2229"/>
  <!-- Right Eye -->
  <circle cx="240" cy="180" r="6" fill="#1E2229"/>
  <!-- Mouth (Flat straight line) -->
  <path d="M 192 198 L 208 198" stroke="#1E2229" stroke-width="8" stroke-linecap="round"/>
</svg>
